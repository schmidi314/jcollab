[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jcollab"
version = "0.1.0"
description = "MCP server for live co-editing and running of JupyterLab notebooks (Yjs, verified writes, multi-instance discovery)"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "websockets>=13",
    "jupyter-nbmodel-client>=1.5.1,<2",
    # Must match the Yjs schema of the *server*. jupyter-ydoc 4.x clients against a 3.x server duplicate cells locally.
    "jupyter-ydoc>=3.0,<4",
    "pycrdt>=0.12.50,<0.14",
    "jupyter-core",
    "nbformat",
]

[project.scripts]
jcollab = "jcollab.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jcollab"]
